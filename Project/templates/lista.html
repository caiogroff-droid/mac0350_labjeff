<div id="main">
  <div class="section-title">Rankings</div>

  <div class="filter-bar">
    <span style="font-size:13px; color:var(--text-muted)">Ordenar:</span>
    <button hx-get="/lista?filtro=nota" hx-target="#main" id="nota" onclick="activeFilterButton('nota')">Por nota</button>
    <button hx-get="/lista?filtro=nome" hx-target="#main" id="nome" onclick="activeFilterButton('nome')">Por nome</button>
    <button hx-get="/lista?filtro=plataforma" hx-target="#main" id="plataforma" onclick="activeFilterButton('plataforma')">Por plataforma</button>
    <span id="indicator" class="htmx-indicator" style="margin-left:auto">Carregando...</span>
  </div>

  <div class="search-wrap">
    <input
      type="text"
      name="busca"
      placeholder="Buscar jogo..."
      hx-get="/lista"
      hx-trigger="input changed delay:400ms"
      hx-select="#lista"
      hx-target="#lista"
      hx-indicator="#indicator"
    />
  </div>

  <div id="lista">
    {% for jogo in jogos %}
    <div class="game-card">
      <div>
        {% for plataforma in jogo.plataforma %}
        <span class="game-platform-badge">{{ plataforma.nome }}</span>
        {% else %}
        <span class="game-platform-badge" style="opacity:0.5">—</span>
        {% endfor %}
      </div>
      <div class="game-info">
        <h3>{{ jogo.nome }}</h3>
        <p>{{ jogo.descricao or 'Sem descrição' }}</p>
      </div>
      <div class="game-score">
        <div class="score-num">{{ jogo.nota or '—' }}</div>
        <div class="score-label">nota</div>
      </div>
    </div>
    {% else %}
    <div class="empty-state"><p>Nenhum jogo cadastrado ainda.</p></div>
    {% endfor %}
  </div>
</div>

<script>
  function activeFilterButton(filter) {
    document.querySelectorAll('.filter-bar button').forEach(btn => btn.classList.remove('selected'));
    const el = document.getElementById(filter);
    if (el) el.classList.add('selected');
  }
</script>
