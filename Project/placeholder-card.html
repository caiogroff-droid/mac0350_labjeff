<!-- Here will be the list of jogos -->
<div id="jogo-list">
  <div id="jogo-card-container" class="flex-h">
    <!-- placeholder for jogo card, composed by one button to drag and the jogo card on the right -->
    <button id="drag-button" class="flex-1">
      <img
        src="/static/assets/drag.png"
        alt="drag icon"
        style="width: 20%; height: 20%"
      />
    </button>
    <div id="jogo-card" class="flex-3 ml-lg">
      <h2>Jogo Title</h2>
      <p>Jogo description</p>
    </div>
    <div id="avg-score" class="flex-1 ml-lg">
      <h3>Average Score</h3>
      <p>8.5</p>
    </div>
  </div>
</div>
